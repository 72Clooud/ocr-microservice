services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  worker:
    build: .
    command: ["uv", "run", "celery", "-A", "tasks.celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      minio:
        condition: service_started
      model-init:
        condition: service_completed_successfully

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  model-init:
    image: alpine:latest
    command: >
      sh -c "
      apk add --no-cache curl &&
      mkdir -p /models &&
      echo 'Pobieranie modelu GGUF...' &&
      curl -L -o /models/glm-ocr-q8_0.gguf https://huggingface.co/mradermacher/GLM-OCR-GGUF/resolve/main/GLM-OCR.Q8_0.gguf &&
      echo 'Pobieranie adaptera Vision (mmproj)...' &&
      curl -L -o /models/mmproj-glm-ocr.gguf https://huggingface.co/mradermacher/GLM-OCR-GGUF/resolve/main/GLM-OCR.mmproj-Q8_0.gguf
      "
    volumes:
      - llama_models:/models

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8080:8080"
    volumes:
      - llama_models:/models
    depends_on:
      model-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      -m /models/glm-ocr-q8_0.gguf
      --mmproj /models/mmproj-glm-ocr.gguf
      --host 0.0.0.0
      --port 8080
      -c 8192
      -cb
      -ngl 999

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

volumes:
  minio_data:
  llama_models:
  redis_data: